[package]
name = "osu-downloader"
version = "0.21.1"
edition = "2024"
autotests = false
publish = false
authors = ["uwuclxdy"]
description = "Library for downloading osu! beatmaps from multiple mirrors"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uwuclxdy/osu-downloader"
keywords = ["osu", "beatmap", "download", "mirror"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "default-tls"] }
tokio = { version = "1.52.3", features = ["rt", "fs", "io-util", "sync", "time", "macros"] }
tokio-stream = "0.1.18"
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bytes = "1.11.1"
md-5 = "0.11.0"
dashmap = "6.2.1"
thiserror = "2.0.18"
urlencoding = "2.1.3"
tracing = "0.1.44"
memchr = "2.7.6"
httpdate = "1.0.3"

[[bench]]
name = "downloader"
harness = false

[[example]]
name = "tune"
required-features = ["instrument", "collection"]

[dev-dependencies]
# "signal" is only needed by examples/tune.rs (ctrl-c handling); everything
# else in dev-dependencies predates that need.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal"] }
tokio-test = "0.4.5"
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = ["collection", "size-fetch", "search", "filter"]

# osucollector.com client + Collection types
collection = []

# nzbasic batch-beatmap-downloader filter API client
filter = []

# Beatmapset size fetching
size-fetch = []

# osu! API v2 beatmapset search client
search = []

# Expose test helpers (e.g. Downloader::with_client) for integration tests in dependent crates
test-helpers = []

# Per-attempt observer callback for the scheduler-tuning harness. Off by default.
instrument = []
